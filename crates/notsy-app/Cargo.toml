[package]
name = "notsy-app"
description = "Notsy's app model: the whole state of the app, driven by plain calls, shared by every OS shell"
version.workspace = true
edition.workspace = true
publish.workspace = true

# No OS code in here: everything the model needs from the OS is a trait in
# `services`, which the shell implements and hands over. It builds and tests
# on Windows, macOS and Linux alike.
[dependencies]
notsy-assist = { path = "../notsy-assist" }
notsy-convert = { path = "../notsy-convert" }
notsy-core = { path = "../notsy-core" }
notsy-editor = { path = "../notsy-editor" }
notsy-markdown = { path = "../notsy-markdown" }
notsy-text = { path = "../notsy-text" }
notsy-ui = { path = "../notsy-ui" }
