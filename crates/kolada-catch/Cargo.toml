[package]
name = "kolada-catch"
description = "Catcher for Kolada, the browser extension's core: a page caught as a note (kolada-convert), sent through Beam as a paired device (kolada-sync), as WebAssembly"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kolada-convert = { path = "../kolada-convert" }
kolada-core = { path = "../kolada-core" }
kolada-sync = { path = "../kolada-sync" }

# In a browser, randomness comes from the page's crypto.getRandomValues,
# through an import of our own (`kolada.random`): no bindings generator.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom02 = { package = "getrandom", version = "0.2", features = ["custom"] }
getrandom03 = { package = "getrandom", version = "0.3" }

[dev-dependencies]
kolada-sync = { path = "../kolada-sync", features = ["testing"] }
