[package]
name = "notsy-mac"
description = "Notsy for the Mac: the AppKit shell around the shared engine"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "notsy-mac"
path = "src/main.rs"

# Everything is Mac-only, so other platforms build an empty program.
[target.'cfg(target_os = "macos")'.dependencies]
notsy-app = { path = "../notsy-app" }
notsy-assist = { path = "../notsy-assist" }
notsy-convert = { path = "../notsy-convert" }
notsy-core = { path = "../notsy-core" }
notsy-editor = { path = "../notsy-editor" }
notsy-markdown = { path = "../notsy-markdown" }
notsy-text = { path = "../notsy-text" }
notsy-ui = { path = "../notsy-ui" }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-core-graphics = "0.3"
objc2-quartz-core = "0.3"
objc2-core-foundation = "0.3"
libc = "0.2"
