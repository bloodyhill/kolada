[package]
name = "notsy-ui"
description = "Notsy's screen as plain data and the pure behaviour around it, shared by every OS shell"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
notsy-core = { path = "../notsy-core" }
notsy-editor = { path = "../notsy-editor" }
notsy-markdown = { path = "../notsy-markdown" }
notsy-text = { path = "../notsy-text" }
windows-core = "0.62"
# Pure-Rust trig for arcs: icon outlines must come out the same on every OS.
libm = "0.2"
