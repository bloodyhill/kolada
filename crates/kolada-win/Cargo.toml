[package]
name = "kolada-win"
description = "Kolada for Windows: raw Win32 shell, DirectWrite text drawn on the CPU"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "kolada"
path = "src/main.rs"

[dependencies]
kolada-assist = { path = "../kolada-assist" }
kolada-convert = { path = "../kolada-convert" }
kolada-core = { path = "../kolada-core" }
kolada-sync = { path = "../kolada-sync" }
kolada-editor = { path = "../kolada-editor" }
kolada-markdown = { path = "../kolada-markdown" }
kolada-text = { path = "../kolada-text" }
kolada-ui = { path = "../kolada-ui" }
windows-core = "0.62"
windows-numerics = "0.3"

[dependencies.windows]
version = "0.62"
features = [
    "Foundation",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "3"
