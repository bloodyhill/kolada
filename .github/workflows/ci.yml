# Keeps the shared crates green on every OS, so a fix made on Windows is known
# to hold on the Mac and Linux too. No secrets: it only builds and tests.
# Never `cargo fmt` here (the code is not rustfmt-formatted).
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each OS builds the shared crates plus its own shell. kolada-ai needs
          # cmake and the llama.cpp submodule: it has its own job below.
          # kolada-bench measures Windows apps and builds only there.
          # kolada-app (the shared app model, which every shell drives) is not
          # excluded anywhere: it has no OS code, so it must pass on all three.
          - os: windows-latest
            exclude: --exclude kolada-ai --exclude kolada-mac
          - os: macos-latest
            exclude: --exclude kolada-ai --exclude kolada-win --exclude kolada-bench
          - os: ubuntu-latest
            exclude: --exclude kolada-ai --exclude kolada-win --exclude kolada-mac --exclude kolada-bench
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.os }}
      # kolada-app's tests lay text out in the OS's own fonts (kolada_ui::testing):
      # on Linux that is DejaVu, which the runners normally have.
      - name: Fonts for the app model's tests (Linux)
        if: runner.os == 'Linux'
        run: fc-list | grep -qi dejavu || sudo apt-get install -y fonts-dejavu-core
      - name: Test
        run: cargo test --workspace --release --no-fail-fast ${{ matrix.exclude }}
      # Reported, not fatal, until the warnings are worked down.
      - name: Clippy
        continue-on-error: true
        run: cargo clippy --workspace --release ${{ matrix.exclude }}

  # The local writing model: llama.cpp built from the submodule (CPU only) by
  # kolada-ai's build.rs, which needs cmake (preinstalled on the runners; Linux
  # also needs a C++ compiler, which it has). Slow, so it is its own job, and
  # not required to pass yet: only the Windows build has been tried so far.
  ai:
    name: kolada-ai (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ai-${{ matrix.os }}
      - name: Test
        run: cargo test -p kolada-ai --release --no-fail-fast
