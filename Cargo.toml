[workspace]
resolver = "3"
members = ["crates/kolada-core", "crates/kolada-editor", "crates/kolada-markdown", "crates/kolada-convert", "crates/kolada-assist", "crates/kolada-ai", "crates/kolada-mac", "crates/kolada-app", "crates/kolada-ios", "crates/kolada-text", "crates/kolada-ui", "crates/kolada-win", "tools/vaultgen", "tools/kolada-bench", "tools/icongen", "tools/iconfont", "tools/textspike", "tools/setup"]

[workspace.package]
version = "0.2.0"
edition = "2024"
publish = false

# Startup speed is the product: every release build is fully optimized.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
# Line tables go to the separate PDB (keeps WPA stacks readable, exe size unchanged).
debug = "line-tables-only"
