[workspace]
resolver = "3"
members = ["crates/notsy-core", "crates/notsy-editor", "crates/notsy-markdown", "crates/notsy-convert", "crates/notsy-assist", "crates/notsy-ai", "crates/notsy-mac", "crates/notsy-app", "crates/notsy-text", "crates/notsy-ui", "crates/notsy-win", "tools/vaultgen", "tools/notsy-bench", "tools/icongen", "tools/iconfont", "tools/textspike", "tools/setup"]

[workspace.package]
version = "0.1.1"
edition = "2024"
publish = false

# Startup speed is the product: every release build is fully optimized.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
# Line tables go to the separate PDB (keeps WPA stacks readable, exe size unchanged).
debug = "line-tables-only"
